<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>QR code component</title>

</head>
<body>

  <main class="qr-card">
    <div class="qr-card__image">
      <img class="qr-card__ornaments" src="./images/qr-ornaments.svg" alt="" width="533" height="639">
      <img class="qr-card__code" src="./images/qr-code.svg" alt="QR code to visit Frontend Mentor" width="160" height="160">
    </div>

    <div class="qr-card__text">
      <h1 class="text-preset-1">Improve your front-end skills by building projects</h1>
      <p class="text-preset-2">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>

</body>
</html>
